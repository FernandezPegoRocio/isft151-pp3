<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WebCraft — Entorno Blockly</title>
    <style>
        .blockly-workspace-container {
            width: 100%;
            height: 600px;
        }

        .webcraft-workspace-area {
            display: flex;
            gap: 8px;
        }

        /* El lienzo de Blockly necesita más ancho que el panel de al lado:
           con el mismo flex:1 para los dos queda angosto y el menú
           desplegable de bloques y la papelera se renderizan mal. */
        .webcraft-workspace-area > blockly-workspace-view {
            flex: 2;
            min-width: 500px;
        }

        /* Preview y Code Preview comparten este panel y se turnan con el
           botón "Previsualizar HTML" — por eso van apilados, uno arriba del
           otro, y JS decide con display cuál se ve. */
        .webcraft-preview-area {
            flex: 1;
            min-width: 250px;
            display: grid;
        }

        .webcraft-preview-area > * {
            grid-area: 1 / 1;
        }
    </style>
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
    <script src="https://unpkg.com/blockly/msg/es.js"></script>

    <!-- script para exportar a PNG -->
    <script src="https://unpkg.com/html2canvas/dist/html2canvas.min.js"></script>
</head>
<body>
    <script type="module" src="./WebCraftApplication.js"></script>
</body>
</html>
